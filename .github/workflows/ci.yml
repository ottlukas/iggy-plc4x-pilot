name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-reader/pom.xml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: mvn -B -f java-reader/pom.xml -DskipTests compile
      - run: docker compose config
      - name: Start and stop core services
        run: |
          docker compose up --wait --wait-timeout 90 -d bifromq iggy iotdb
          docker compose down --remove-orphans

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-reader/pom.xml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: mvn -B -f java-reader/pom.xml test

  integration-tests:
    name: End-to-end pipeline
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PILOT_COMPOSE_PROJECT: iggy-plc4x-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Docker-backed integration test
        run: cargo test --locked --features integration --test integration -- --nocapture

  build-images:
    name: Build and publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iggy-plc4x-pilot:latest
            ghcr.io/${{ github.repository_owner }}/iggy-plc4x-pilot:${{ github.sha }}
      - name: Publish Superset image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.superset
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iggy-plc4x-superset:latest
            ghcr.io/${{ github.repository_owner }}/iggy-plc4x-superset:${{ github.sha }}
