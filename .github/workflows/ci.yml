name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-reader/pom.xml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: mvn -B -f java-reader/pom.xml -DskipTests compile
      - run: docker compose config --quiet
      - name: Start and stop core services
        run: |
          trap 'docker compose down --remove-orphans' EXIT
          docker compose up --wait --wait-timeout 90 -d bifromq iggy iotdb

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-reader/pom.xml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: mvn -B -f java-reader/pom.xml test

  integration-tests:
    name: End-to-end pipeline
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PILOT_COMPOSE_PROJECT: iggy-plc4x-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-reader/pom.xml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --features integration --test integration -- --nocapture
      - name: Tear down integration stack
        if: always()
        run: docker compose -p "$PILOT_COMPOSE_PROJECT" down --volumes --remove-orphans

  build-images:
    name: Build runtime image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: iggy-plc4x-pilot:ci