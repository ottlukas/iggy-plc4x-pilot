name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-reader/pom.xml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: mvn -B -f java-reader/pom.xml -DskipTests compile
      - run: docker compose config
      - name: Start and stop core services
        run: |
          docker compose up --wait --wait-timeout 90 -d bifromq iggy iotdb
          docker compose down --remove-orphans

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-reader/pom.xml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: mvn -B -f java-reader/pom.xml test

  integration-tests:
    name: End-to-end pipeline
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PILOT_COMPOSE_PROJECT: iggy-plc4x-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Docker images
        run: docker compose build
      - name: Start services for end-to-end test
        run: |
          docker compose -p $PILOT_COMPOSE_PROJECT up --build -d bifromq iggy iotdb modbus-simulator plc4x-bridge mqtt-to-iggy iggy-to-iotdb superset hmi
          docker compose -p $PILOT_COMPOSE_PROJECT ps -a
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to initialize..."
          for i in {1..24}; do
            if curl -s http://localhost:18080/rest/v2/settings -u root:root > /dev/null 2>&1; then
              echo "IoTDB is ready"
              break
            fi
            if [ $i -eq 24 ]; then
              echo "IoTDB did not become ready"
              exit 1
            fi
            sleep 5
          done
          for i in {1..12}; do
            if curl -s http://localhost:8088/health > /dev/null 2>&1; then
              echo "Superset is ready"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "Superset did not become ready"
              exit 1
            fi
            sleep 5
          done
          for i in {1..12}; do
            if curl -s http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "HMI is ready"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "HMI did not become ready"
              exit 1
            fi
            sleep 5
          done
      - name: Run Docker-backed integration test
        run: cargo test --locked --features integration --test integration -- --nocapture
      - name: Cleanup
        if: always()
        run: docker compose -p $PILOT_COMPOSE_PROJECT down --volumes --remove-orphans

  build-images:
    name: Build and publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iggy-plc4x-pilot:latest
            ghcr.io/${{ github.repository_owner }}/iggy-plc4x-pilot:${{ github.sha }}
      - name: Publish Superset image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.superset
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iggy-plc4x-superset:latest
            ghcr.io/${{ github.repository_owner }}/iggy-plc4x-superset:${{ github.sha }}
      - name: Publish HMI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hmi/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iggy-plc4x-hmi:latest
            ghcr.io/${{ github.repository_owner }}/iggy-plc4x-hmi:${{ github.sha }}
